name: Prepare SALTA v0.8.120 work version

on:
  push:
    branches:
      - "work/v0.8.120-thermostat-control-duty-cycle"

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.120-thermostat-control-duty-cycle
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update complete release version
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ "$current" = "0.8.120" ]; then
            echo "SALTA is already at 0.8.120"
            exit 0
          fi
          node scripts/set-version.mjs 0.8.120

      - name: Commit version surfaces
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): prepare SALTA v0.8.120"
          git push origin HEAD:work/v0.8.120-thermostat-control-duty-cycle
