name: v0.8.104 OpenCCU regression test

on:
  push:
    branches:
      - test/v0.8.104-openccu

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v0.8.104 OpenCCU core patch
        run: git apply .github/v08104-core.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete SALTA quality gate
        run: npm run check
