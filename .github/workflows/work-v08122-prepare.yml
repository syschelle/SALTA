name: Prepare SALTA v0.8.122

on:
  push:
    branches:
      - work/v0.8.122-duty-cycle-colors

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.122-duty-cycle-colors
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.122
        shell: bash
        run: |
          npm run version:set -- 0.8.122
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExact = (file, from, to) => {
            const source = fs.readFileSync(file, 'utf8');
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${file}: expected one occurrence of ${JSON.stringify(from)}, found ${count}`);
            fs.writeFileSync(file, source.replace(from, to));
          };

          replaceExact(
            'src/openccu-duty-cycle.ts',
            ".overview-duty-cycle-stat.ok strong{color:var(--green)}.overview-duty-cycle-stat.warning strong{color:var(--accent)}.overview-duty-cycle-stat.alarm strong{color:var(--state-off-accent)}",
            ".overview-duty-cycle-stat.ok strong{color:var(--green)}.overview-duty-cycle-stat.warning strong{color:#9a7600}html[data-theme=\\\"dark\\\"] .overview-duty-cycle-stat.warning strong{color:#ffd54f}.overview-duty-cycle-stat.alarm strong{color:var(--state-off-accent)}"
          );
          replaceExact(
            'src/openccu-duty-cycle.ts',
            "card.classList.add(duty>=90?'alarm':duty>=70?'warning':'ok');",
            "card.classList.add(duty>10?'alarm':duty>4?'warning':'ok');"
          );

          replaceExact(
            'src/openccu-duty-cycle.test.ts',
            'it("adds a sixth overview statistic and keeps the OpenCCU 70/90 percent warning thresholds", () => {',
            'it("adds a sixth overview statistic and colors the percentage at 4/10 percent thresholds", () => {'
          );
          replaceExact(
            'src/openccu-duty-cycle.test.ts',
            'expect(OPENCCU_DUTY_CYCLE_FRONTEND).toContain("duty>=90?\'alarm\':duty>=70?\'warning\':\'ok\'");',
            'expect(OPENCCU_DUTY_CYCLE_FRONTEND).toContain("duty>10?\'alarm\':duty>4?\'warning\':\'ok\'");\n    expect(OPENCCU_DUTY_CYCLE_FRONTEND).toContain(".overview-duty-cycle-stat.warning strong{color:#9a7600}");\n    expect(OPENCCU_DUTY_CYCLE_FRONTEND).toContain("html[data-theme=\\\"dark\\\"] .overview-duty-cycle-stat.warning strong{color:#ffd54f}");'
          );

          replaceExact(
            'scripts/validate-release.mjs',
            "duty>=90?'alarm':duty>=70?'warning':'ok'",
            "duty>10?'alarm':duty>4?'warning':'ok'"
          );

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.startsWith('# Changelog\n\n')) throw new Error('Unexpected CHANGELOG header');
          fs.writeFileSync('CHANGELOG.md', changelog.replace('# Changelog\n\n', `# Changelog\n\n## 0.8.122 - Duty Cycle percentage colors\n\n- Changed only the overview Duty Cycle percentage text color: values up to and including 4% are green, values above 4% up to and including 10% are yellow, and values above 10% are red.\n- Added a dedicated yellow warning color for the Duty Cycle percentage in both light and dark themes instead of reusing the general accent color.\n- OpenCCU Duty Cycle polling, API data, maximum-value selection and refresh cadence are unchanged.\n- Added regression and release-validator coverage for the new 4%/10% display thresholds.\n- No database schema, dependency, mandatory environment-variable, HomeKit pairing or deployment-topology change is required.\n\n`));

          fs.writeFileSync('RELEASE_TEXT.md', `# SALTA v0.8.122\n\nSALTA v0.8.122 improves the OpenCCU Duty Cycle overview by applying the requested percentage text colors.\n\n## Changes\n\n- Duty Cycle values up to and including 4% are displayed in green.\n- Duty Cycle values above 4% up to and including 10% are displayed in yellow.\n- Duty Cycle values above 10% are displayed in red.\n- The color is applied to the percentage text only; the overview card layout and label remain unchanged.\n- The yellow state now has a dedicated readable color for light and dark themes instead of using SALTA's general accent color.\n- OpenCCU Duty Cycle acquisition via \`Interface.getDutyCycle\`, maximum-value selection, API response and one-minute refresh cadence are unchanged.\n\n## Root Cause\n\nThe Duty Cycle overview introduced in v0.8.120 still used the original 70%/90% frontend warning thresholds. As a result, normal low Duty Cycle values stayed green and the intermediate state used the generic accent color rather than a dedicated yellow percentage color.\n\nv0.8.122 changes only the presentation thresholds and warning text color requested for the overview. It does not alter OpenCCU communication or Duty Cycle measurement.\n\n## Compatibility\n\n- No database schema change or migration is required.\n- No npm dependency is added or changed.\n- No new mandatory environment variable is introduced.\n- Existing automations require no editing.\n- Existing PostgreSQL and SALTA runtime volumes remain compatible.\n- Existing HomeKit pairing state remains compatible.\n- OpenCCU device discovery, thermostat control and Duty Cycle polling are unchanged.\n\n## Tests\n\n- Regression coverage verifies the new 4%/10% Duty Cycle frontend thresholds.\n- Regression coverage verifies that the yellow warning state has dedicated light- and dark-theme text colors.\n- Release-validator coverage requires the new Duty Cycle threshold expression.\n- Release validator, JavaScript syntax checks, TypeScript production build and complete test suite are executed by GitHub Actions before release.\n\n## Production update\n\n\`\`\`bash\ncd /opt/SALTA\ngit pull --ff-only origin main\ndocker compose --env-file .env -f docker-compose.image.yml config\ndocker compose --env-file .env -f docker-compose.image.yml pull\ndocker compose --env-file .env -f docker-compose.image.yml up -d --force-recreate --remove-orphans\ndocker compose --env-file .env -f docker-compose.image.yml ps\n\`\`\`\n\nDo not use \`docker compose down -v\` during the update. Keep the existing PostgreSQL, SALTA runtime and HomeKit data/volumes.\n`);
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit prepared release
        shell: bash
        run: |
          rm .github/workflows/work-v08122-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): add Duty Cycle percentage colors"
          git push origin HEAD:work/v0.8.122-duty-cycle-colors
