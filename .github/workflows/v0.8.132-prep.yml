name: Validate v0.8.132 work branch

on:
  push:
    branches:
      - work/v0.8.132-fritz-smarthome

permissions:
  contents: write

jobs:
  prepare-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.8.132-fritz-smarthome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare release tree
        run: node scripts/prepare-v0.8.132.mjs
      - name: Remove temporary preparation files
        run: |
          rm scripts/prepare-v0.8.132.mjs
          rm .github/workflows/v0.8.132-prep.yml
      - name: Full SALTA quality gate
        run: npm run check
      - name: Commit validated release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add optional FRITZ!Box Smart Home integration"
          git push origin HEAD:work/v0.8.132-fritz-smarthome
