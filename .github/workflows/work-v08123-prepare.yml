name: Prepare SALTA v0.8.123

on:
  push:
    branches:
      - "work/v0.8.123-automation-room-groups"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.123-automation-room-groups
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.123
        run: |
          npm run version:set -- 0.8.123
          node scripts/prepare-v08123.mjs
          node scripts/prepare-v08123-validator.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit prepared release
        run: |
          rm .github/workflows/work-v08123-prepare.yml scripts/prepare-v08123.mjs scripts/prepare-v08123-validator.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): group automations by room"
          git push origin HEAD:work/v0.8.123-automation-room-groups
