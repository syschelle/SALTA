name: v0.8.129 preparation

on:
  push:
    branches:
      - work/v0.8.129-openccu-contact-callback

concurrency:
  group: salta-v08129-prepare
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.129-openccu-contact-callback
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.129 source and tests
        run: |
          node scripts/set-version.mjs 0.8.129
          python3 scripts/prepare-v08129.py

      - name: Validate optional deployment helper scripts
        shell: bash
        run: |
          for script in install.sh update.sh backup.sh restore.sh; do
            if [ -f "$script" ]; then
              sh -n "$script"
            fi
          done

      - name: Validate npm lockfile registry
        shell: bash
        run: |
          if grep -q "packages.applied-caas-gateway\|internal.api.openai.org" package-lock.json; then
            echo "::error::package-lock.json contains an internal npm registry URL"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit validated v0.8.129 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/work-v08129-prepare.yml scripts/prepare-v08129.py
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 1
          fi
          git commit -m "fix(openccu): bind realtime contacts from registry for v0.8.129 [skip ci]"
          git push origin HEAD:work/v0.8.129-openccu-contact-callback
