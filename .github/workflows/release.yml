name: Publish SALTA container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: salta-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag commit is not contained in main"
            exit 1
          }

      - name: Verify tag version and release contract
        shell: bash
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME || '';
          if (tag !== 'v' + pkg.version) {
            console.error('::error::Tag ' + tag + ' does not match package version v' + pkg.version);
            process.exit(1);
          }
          NODE
          node scripts/validate-release.mjs

  publish:
    name: Build and publish amd64 + arm64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=SALTA
            org.opencontainers.image.description=Smart-home Abstraction and Local Transport Architecture
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=salta-container
          cache-to: type=gha,mode=min,scope=salta-container

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## SALTA container published"
            echo
            echo "**Image:** \`${{ env.REGISTRY }}/${{ steps.image.outputs.name }}\`"
            echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`"
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
