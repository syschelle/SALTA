name: Validate v0.8.136 work branch

on:
  push:
    branches:
      - work/v0.8.136-fritz-smarthome-pbkdf2-only

permissions:
  contents: write

jobs:
  prepare-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.8.136-fritz-smarthome-pbkdf2-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Align preparation with existing release helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/prepare-v0.8.136.mjs')
          text = path.read_text()

          import_rewrite = 'replaceOnce("src/fritzbox-smarthome.ts", \'import { createHash, pbkdf2Sync } from "node:crypto";\', \'import { pbkdf2Sync } from "node:crypto";\');\n'
          if text.count(import_rewrite) != 1:
              raise SystemExit(f'expected one crypto-import rewrite, found {text.count(import_rewrite)}')
          text = text.replace(import_rewrite, '')

          old = "'## Current v0.8.135 update\\n\\nv0.8.135 preserves SALTA-local FRITZ!Box device room and presentation metadata across Smart Home synchronization and refreshes the Smart Home runtime status on the Presence page. No schema migration or device re-import is required.'"
          new = "'## Current v0.8.136 update\\n\\nv0.8.135 preserves SALTA-local FRITZ!Box device room and presentation metadata across Smart Home synchronization and refreshes the Smart Home runtime status on the Presence page. No schema migration or device re-import is required.'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one migration-prep match, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Prepare release tree
        run: node scripts/prepare-v0.8.136.mjs
      - name: Remove temporary preparation files
        run: |
          rm scripts/prepare-v0.8.136.mjs
          rm .github/workflows/v0.8.136-prep.yml
      - name: Full SALTA quality gate
        run: npm run check
      - name: Commit validated release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: require PBKDF2 for FRITZ Smart Home login"
          git push origin HEAD:work/v0.8.136-fritz-smarthome-pbkdf2-only
