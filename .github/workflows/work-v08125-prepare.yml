name: Prepare SALTA v0.8.125 automation log topic

on:
  push:
    branches:
      - work/v0.8.125-automation-log-name
    paths:
      - .github/workflows/work-v08125-prepare.yml
      - scripts/prepare-v08125.mjs

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.125-automation-log-name
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.125
        run: node scripts/prepare-v08125.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit validated release tree
        run: |
          rm .github/workflows/work-v08125-prepare.yml scripts/prepare-v08125.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(logs): show automation names in system-log topics"
          git push origin HEAD:work/v0.8.125-automation-log-name
