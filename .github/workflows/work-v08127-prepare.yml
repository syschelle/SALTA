name: Finalize SALTA v0.8.127 worktree

on:
  push:
    branches:
      - work/v0.8.127-log-accent-ci-noise
    paths:
      - .github/workflows/work-v08127-prepare.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.127-log-accent-ci-noise
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare already-validated v0.8.127 tree
        run: |
          node scripts/prepare-v08127.mjs
          git restore .github/workflows/release.yml

      - name: Commit non-workflow release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "fix(logs): apply validated v0.8.127 product and release files"
          git push origin HEAD:work/v0.8.127-log-accent-ci-noise
