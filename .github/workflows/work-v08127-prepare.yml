name: Prepare SALTA v0.8.127

on:
  push:
    branches:
      - work/v0.8.127-log-accent-ci-noise
    paths:
      - .github/workflows/work-v08127-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.127-log-accent-ci-noise
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.127
        run: node scripts/prepare-v08127.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit validated release tree
        shell: bash
        run: |
          rm .github/workflows/work-v08127-prepare.yml scripts/prepare-v08127.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(logs): publish reliable automation accent and reduce CI noise"
          git push origin HEAD:work/v0.8.127-log-accent-ci-noise

# Corrected preparation rerun after removing the obsolete CodeQL workflow.
