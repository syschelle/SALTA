name: Build SALTA v0.8.139 HomeKit Shelly fix

on:
  push:
    branches:
      - work/v0.8.139-homekit-shelly-write-readback

permissions:
  contents: write

jobs:
  build-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Apply code and regression changes
        run: python3 scripts/v0.8.139-build.py

      - name: Set complete SALTA version
        run: npm run version:set -- 0.8.139

      - name: Update release documentation
        run: python3 scripts/v0.8.139-docs.py

      - name: Audit dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Remove temporary build files
        run: rm .github/workflows/v0.8.139-homekit-shelly-fix.yml scripts/v0.8.139-build.py scripts/v0.8.139-docs.py

      - name: Commit validated v0.8.139 tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make HomeKit Shelly switch writes resilient"
          git push origin HEAD:work/v0.8.139-homekit-shelly-write-readback
