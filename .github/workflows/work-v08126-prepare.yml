name: Prepare SALTA v0.8.126 automation log accent

on:
  push:
    branches:
      - work/v0.8.126-automation-log-accent
    paths:
      - .github/workflows/work-v08126-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.126-automation-log-accent
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.126
        run: node scripts/prepare-v08126.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit validated release tree
        run: |
          rm .github/workflows/work-v08126-prepare.yml scripts/prepare-v08126.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(logs): accent automation names in system-log topics"
          git push origin HEAD:work/v0.8.126-automation-log-accent
