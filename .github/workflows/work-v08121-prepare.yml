name: Prepare SALTA v0.8.121 protocol fix

on:
  push:
    branches:
      - work/v0.8.121-openccu-double-wire-type

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.121-openccu-double-wire-type
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.8.121 version and narrow OpenCCU wire-type fix
        shell: bash
        run: |
          node scripts/set-version.mjs 0.8.121
          node <<'NODE'
          const fs = require('node:fs');

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, content) => fs.writeFileSync(file, content, 'utf8');
          const replaceExact = (source, from, to, label, count = 1) => {
            const found = source.split(from).length - 1;
            if (found !== count) throw new Error(`${label}: expected ${count} occurrence(s), found ${found}`);
            return source.split(from).join(to);
          };

          const controlClientPath = 'src/openccu-control-client.ts';
          let controlClient = read(controlClientPath);
          controlClient = replaceExact(
            controlClient,
            'const requestTimeoutMs = 15_000;\n\nfunction sessionInvalid',
            `const requestTimeoutMs = 15_000;\n\nexport function openCcuSetValueWireType(valueType: unknown): string {\n  const normalized = String(valueType ?? "").trim().toLowerCase();\n  return normalized === "float" ? "double" : normalized;\n}\n\nexport function openCcuControlRpcParams(method: string, params: JsonRecord): JsonRecord {\n  const serialized = stringifyRpcParams(params);\n  if (method === "Interface.setValue" && "type" in serialized) {\n    serialized.type = openCcuSetValueWireType(serialized.type);\n  }\n  return serialized;\n}\n\nfunction sessionInvalid`,
            'insert OpenCCU setValue wire-type normalization'
          );
          controlClient = replaceExact(
            controlClient,
            'body: JSON.stringify({ method, params: stringifyRpcParams(params), jsonrpc: "1.1", id: ++this.requestId }),',
            'body: JSON.stringify({ method, params: openCcuControlRpcParams(method, params), jsonrpc: "1.1", id: ++this.requestId }),',
            'route control RPC parameters through wire normalizer'
          );
          write(controlClientPath, controlClient);

          const thermostatPath = 'src/openccu-thermostat-controller.ts';
          let thermostat = read(thermostatPath);
          thermostat = replaceExact(
            thermostat,
            'import type { OpenCcuControlConnection, OpenCcuControlTransport } from "./openccu-control-client.js";',
            'import { openCcuSetValueWireType } from "./openccu-control-client.js";\nimport type { OpenCcuControlConnection, OpenCcuControlTransport } from "./openccu-control-client.js";',
            'import effective OpenCCU wire-type helper'
          );
          thermostat = replaceExact(
            thermostat,
            '    type: write.valueType,',
            '    type: openCcuSetValueWireType(write.valueType),',
            'log actual Interface.setValue wire type'
          );
          write(thermostatPath, thermostat);

          const testPath = 'src/openccu-v08121-wire-type.test.ts';
          write(testPath, `import { describe, expect, it } from "vitest";\nimport { openCcuControlRpcParams, openCcuSetValueWireType } from "./openccu-control-client.js";\n\ndescribe("OpenCCU v0.8.121 setValue wire types", () => {\n  it("maps HomeMatic FLOAT metadata to the OpenCCU XML-RPC double wire type", () => {\n    expect(openCcuSetValueWireType("float")).toBe("double");\n    expect(openCcuSetValueWireType("FLOAT")).toBe("double");\n    expect(openCcuControlRpcParams("Interface.setValue", {\n      interface: "BidCos-RF",\n      address: "MEQ0004123:2",\n      valueKey: "SET_TEMPERATURE",\n      type: "float",\n      value: 15\n    })).toEqual({\n      interface: "BidCos-RF",\n      address: "MEQ0004123:2",\n      valueKey: "SET_TEMPERATURE",\n      type: "double",\n      value: "15"\n    });\n  });\n\n  it("preserves the other OpenCCU Interface.setValue wire types", () => {\n    expect(openCcuSetValueWireType("double")).toBe("double");\n    expect(openCcuSetValueWireType("int")).toBe("int");\n    expect(openCcuSetValueWireType("bool")).toBe("bool");\n    expect(openCcuSetValueWireType("string")).toBe("string");\n  });\n\n  it("does not reinterpret a type field on unrelated OpenCCU methods", () => {\n    expect(openCcuControlRpcParams("Interface.getParamset", { type: "float", value: 15 })).toEqual({\n      type: "float",\n      value: "15"\n    });\n  });\n});\n`);

          const changelogPath = 'CHANGELOG.md';
          let changelog = read(changelogPath);
          changelog = replaceExact(
            changelog,
            '# Changelog\n\n',
            '# Changelog\n\n## 0.8.121 - OpenCCU thermostat wire-type fix\n\n- Fixed the isolated OpenCCU thermostat control path so HomeMatic `FLOAT` values are sent through `Interface.setValue` with the OpenCCU/XML-RPC wire type `double` instead of `float`.\n- The fix applies to thermostat commands from the Web UI, HomeKit and automations because those paths share the dedicated thermostat controller introduced in v0.8.120.\n- Workflow device selection, per-action temperature values, automation conditions, VirtualDevices handling and global climate policy are unchanged.\n- Thermostat command diagnostics now report the effective wire type actually sent to OpenCCU.\n\n',
            'prepend v0.8.121 changelog entry'
          );
          write(changelogPath, changelog);

          write('RELEASE_TEXT.md', `# SALTA v0.8.121\n\nSALTA v0.8.121 fixes the OpenCCU wire type used for floating-point thermostat commands.\n\n## Changes\n\n- The dedicated OpenCCU thermostat control client now converts an internal HomeMatic `float` write type to the OpenCCU JSON-API/XML-RPC wire type `double` immediately before `Interface.setValue` is sent.\n- The conversion is deliberately limited to `Interface.setValue`; unrelated OpenCCU method parameters are not reinterpreted.\n- Existing `double`, `int`, `bool` and `string` write types remain unchanged.\n- Thermostat diagnostics now show the effective wire type sent to OpenCCU.\n- The automation engine remains fully configurable: the workflow still determines the device, action, individual temperature value, order and conditions.\n- No VirtualDevices, group substitution, global Winter policy or hard-coded thermostat IDs are introduced by this fix.\n\n## Root Cause\n\nThe v0.8.120 production diagnostic showed that Web/API thermostat control and the Nachtabsenkung automation reached the same dedicated thermostat controller, selected the configured physical BidCos device and attempted the requested value, but OpenCCU readback remained unchanged or returned to OFF/4.5 °C.\n\nSALTA derived the write type `float` from HomeMatic `FLOAT` parameter metadata and passed that string directly to OpenCCU `Interface.setValue`. The OpenCCU JSON API forwards the supplied `type` to XML-RPC and documents the supported `Interface.setValue` types as `string`, `int`, `double` and `bool`. Therefore HomeMatic `FLOAT` values must be transported as XML-RPC `double`, not `float`.\n\nv0.8.121 corrects only this protocol boundary. It does not change thermostat selection, automation semantics or the v0.8.120 controller separation.\n\n## Compatibility\n\n- No database schema change or migration is required.\n- No npm dependency is added or changed.\n- No new mandatory environment variable is introduced.\n- Existing automations require no editing.\n- Existing PostgreSQL and SALTA runtime volumes remain compatible.\n- Existing HomeKit pairing state remains compatible.\n- Classic BidCos and HmIP thermostat selection/routing remain unchanged.\n- Non-thermostat automation policy is unchanged.\n\n## Tests\n\n- Regression coverage verifies that `float` becomes `double` for `Interface.setValue`.\n- Regression coverage verifies that `double`, `int`, `bool` and `string` remain unchanged.\n- Regression coverage verifies that unrelated OpenCCU method parameters are not rewritten.\n- Existing OpenCCU thermostat-controller, automation, HomeKit and adapter regression coverage remains enabled.\n- Release validator, JavaScript syntax checks, TypeScript build and the complete test suite must pass before release.\n\n## Production update\n\n\`\`\`bash\ncd /opt/SALTA\ngit pull --ff-only origin main\ndocker compose --env-file .env -f docker-compose.image.yml config\ndocker compose --env-file .env -f docker-compose.image.yml pull\ndocker compose --env-file .env -f docker-compose.image.yml up -d --force-recreate --remove-orphans\ndocker compose --env-file .env -f docker-compose.image.yml ps\n\`\`\`\n\nDo not use \`docker compose down -v\` during the update. Keep the existing PostgreSQL, SALTA runtime and HomeKit data/volumes.\n`);
          NODE

      - name: Run complete release checks
        run: npm run check

      - name: Commit prepared v0.8.121
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(openccu): use double wire type for thermostat floats"
          git push origin HEAD:work/v0.8.121-openccu-double-wire-type
