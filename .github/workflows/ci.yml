name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: salta-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate optional deployment helper scripts
        shell: bash
        run: |
          for script in install.sh update.sh backup.sh restore.sh; do
            if [ -f "$script" ]; then
              sh -n "$script"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate npm lockfile registry
        shell: bash
        run: |
          if grep -q "packages.applied-caas-gateway\|internal.api.openai.org" package-lock.json; then
            echo "::error::package-lock.json contains an internal npm registry URL"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Apply v0.8.112 HomeMatic setback validation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("src/openccu-core.ts")
          text = core.read_text()
          marker = '''  return { writes, state: { controlMode: "off", targetTemperature: minimum } };\n}\n\nfunction fallbackDeviceName'''
          replacement = '''  return { writes, state: { controlMode: "off", targetTemperature: minimum } };\n}\n\nexport function openCcuTargetTemperaturePlan(\n  metadataInput: unknown,\n  state: DeviceState,\n  requestedTemperature: unknown\n): OpenCcuThermostatModePlan {\n  const metadata = record(metadataInput);\n  const targetParameter = stringValue(metadata.targetTemperatureParameter);\n  if (!targetParameter) throw new Error("CAPABILITY_NOT_SUPPORTED");\n\n  const minimum = numberValue(metadata.targetTemperatureMin) ?? 4.5;\n  const maximum = numberValue(metadata.targetTemperatureMax) ?? 30;\n  const temperature = numberValue(requestedTemperature);\n  if (temperature === undefined || temperature < minimum || temperature > maximum) throw new Error("INVALID_TARGET_TEMPERATURE");\n  const rounded = Math.round(temperature * 2) / 2;\n\n  const interfaceName = stringValue(metadata.interfaceName) ?? "";\n  const channelType = stringValue(metadata.channelType) ?? "";\n  const model = stringValue(metadata.model) ?? "";\n  const isHmIp = interfaceName.toUpperCase().includes("HMIP")\n    || model.toUpperCase().startsWith("HMIP-")\n    || channelType.toUpperCase().includes("HEATING_CLIMATECONTROL");\n  const currentMode = String(state.controlMode ?? "").trim().toLowerCase();\n  const manualModeParameter = !isHmIp ? stringValue(metadata.manualModeParameter) : undefined;\n\n  if (manualModeParameter && (currentMode === "manual" || currentMode === "off")) {\n    return {\n      writes: [{\n        parameter: manualModeParameter,\n        valueType: stringValue(metadata.manualModeValueType) ?? "float",\n        value: rounded\n      }],\n      state: {\n        controlMode: rounded <= minimum + 0.01 ? "off" : "manual",\n        targetTemperature: rounded\n      }\n    };\n  }\n\n  return {\n    writes: [{\n      parameter: targetParameter,\n      valueType: stringValue(metadata.targetTemperatureValueType) ?? "float",\n      value: rounded\n    }],\n    state: { targetTemperature: rounded }\n  };\n}\n\nfunction fallbackDeviceName'''
          if marker not in text:
              raise SystemExit("openccu-core.ts validation anchor not found")
          core.write_text(text.replace(marker, replacement, 1))

          adapter = Path("src/openccu-adapter.ts")
          text = adapter.read_text()
          text = text.replace("  openCcuRpcEndpoint,\n  openCcuThermostatModePlan,", "  openCcuRpcEndpoint,\n  openCcuTargetTemperaturePlan,\n  openCcuThermostatModePlan,", 1)
          old = '''    } else if (command.capability === "setTargetTemperature") {\n      const temperature = Number(command.value);\n      const minimum = Number(metadata.targetTemperatureMin ?? 4.5);\n      const maximum = Number(metadata.targetTemperatureMax ?? 30);\n      if (!Number.isFinite(temperature) || temperature < minimum || temperature > maximum) throw new Error("INVALID_TARGET_TEMPERATURE");\n      const rounded = Math.round(temperature * 2) / 2;\n      addWrite(metadata.targetTemperatureParameter, metadata.targetTemperatureValueType ?? "float", rounded);\n      nextState.targetTemperature = rounded;\n      if (nextState.controlMode === "off" && rounded > minimum + 0.01) nextState.controlMode = "manual";\n    } else if (command.capability === "setThermostatMode") {\n'''
          new = '''    } else if (command.capability === "setTargetTemperature") {\n      const plan = openCcuTargetTemperaturePlan(metadata, device.state, command.value);\n      for (const write of plan.writes) addWrite(write.parameter, write.valueType, write.value);\n      Object.assign(nextState, plan.state);\n    } else if (command.capability === "setThermostatMode") {\n'''
          if old not in text:
              raise SystemExit("openccu-adapter.ts validation anchor not found")
          adapter.write_text(text.replace(old, new, 1))

          Path("src/openccu-v08112-regression.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { openCcuTargetTemperaturePlan } from "./openccu-core.js";\n\nconst classicMetadata = {\n  interfaceName: "BidCos-RF",\n  channelType: "CLIMATECONTROL_RT_TRANSCEIVER",\n  model: "HM-TC-IT-WM-W-EU",\n  targetTemperatureParameter: "SET_TEMPERATURE",\n  targetTemperatureValueType: "float",\n  targetTemperatureMin: 4.5,\n  targetTemperatureMax: 30.5,\n  manualModeParameter: "MANU_MODE",\n  manualModeValueType: "float"\n};\n\ndescribe("v0.8.112 classic HomeMatic target-temperature regression", () => {\n  it("keeps a classic HomeMatic thermostat in manual mode while applying night setback", () => {\n    expect(openCcuTargetTemperaturePlan(classicMetadata, { controlMode: "manual", targetTemperature: 20 }, 15)).toEqual({\n      writes: [{ parameter: "MANU_MODE", valueType: "float", value: 15 }],\n      state: { controlMode: "manual", targetTemperature: 15 }\n    });\n  });\n\n  it("wakes a classic HomeMatic thermostat from OFF into manual mode at the requested temperature", () => {\n    expect(openCcuTargetTemperaturePlan(classicMetadata, { controlMode: "off", targetTemperature: 4.5 }, 15)).toEqual({\n      writes: [{ parameter: "MANU_MODE", valueType: "float", value: 15 }],\n      state: { controlMode: "manual", targetTemperature: 15 }\n    });\n  });\n\n  it("preserves AUTO when a normal setpoint write is requested outside manual mode", () => {\n    expect(openCcuTargetTemperaturePlan(classicMetadata, { controlMode: "auto", targetTemperature: 20 }, 15)).toEqual({\n      writes: [{ parameter: "SET_TEMPERATURE", valueType: "float", value: 15 }],\n      state: { targetTemperature: 15 }\n    });\n  });\n\n  it("does not route HmIP temperatures through MANU_MODE even if stale metadata contains it", () => {\n    expect(openCcuTargetTemperaturePlan({\n      ...classicMetadata,\n      interfaceName: "HmIP-RF",\n      model: "HmIP-WTH-2",\n      targetTemperatureParameter: "SET_POINT_TEMPERATURE"\n    }, { controlMode: "manual", targetTemperature: 20 }, 15)).toEqual({\n      writes: [{ parameter: "SET_POINT_TEMPERATURE", valueType: "float", value: 15 }],\n      state: { targetTemperature: 15 }\n    });\n  });\n});\n''')
          PY

      - name: Run complete quality gate
        run: npm run check
