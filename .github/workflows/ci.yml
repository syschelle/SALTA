name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

concurrency:
  group: salta-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate optional deployment helper scripts
        shell: bash
        run: |
          for script in install.sh update.sh backup.sh restore.sh; do
            if [ -f "$script" ]; then
              sh -n "$script"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare v0.8.118 release surfaces
        if: github.ref_name == 'work/v0.8.118-bidcos-off-recovery-diagnostics'
        run: |
          node scripts/set-version.mjs 0.8.118
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): set SALTA v0.8.118"
          git push origin HEAD:work/v0.8.118-bidcos-off-recovery-diagnostics

      - name: Validate npm lockfile registry
        shell: bash
        run: |
          if grep -q "packages.applied-caas-gateway\|internal.api.openai.org" package-lock.json; then
            echo "::error::package-lock.json contains an internal npm registry URL"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

