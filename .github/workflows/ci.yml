name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: salta-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate optional deployment helper scripts
        shell: bash
        run: |
          for script in install.sh update.sh backup.sh restore.sh; do
            if [ -f "$script" ]; then
              sh -n "$script"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate npm lockfile registry
        shell: bash
        run: |
          if grep -q "packages.applied-caas-gateway\|internal.api.openai.org" package-lock.json; then
            echo "::error::package-lock.json contains an internal npm registry URL"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Apply v0.8.113 manual automation trigger validation patch
        shell: bash
        run: |
          cat .github/v08113-patch/part* > /tmp/v08113.patch.gz.b64
          base64 -d /tmp/v08113.patch.gz.b64 > /tmp/v08113.patch.gz
          echo "f59cfac16d1fb836bea4eccdd76aa9af1f97c08970856e71da5d35d9e547b2dc  /tmp/v08113.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v08113.patch.gz > /tmp/v08113.patch
          git apply --check /tmp/v08113.patch
          git apply /tmp/v08113.patch

      - name: Align validation release surfaces to v0.8.113
        shell: bash
        run: |
          cat .github/v08113-release/part* > /tmp/v08113-release.patch.gz.b64
          base64 -d /tmp/v08113-release.patch.gz.b64 > /tmp/v08113-release.patch.gz
          echo "c8a2bcd0de0d75f262abe83c8e50380857f0921d7f97545df472d050447e2b61  /tmp/v08113-release.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v08113-release.patch.gz > /tmp/v08113-release.patch
          git apply --check /tmp/v08113-release.patch
          git apply /tmp/v08113-release.patch

      - name: Run complete quality gate
        run: npm run check
