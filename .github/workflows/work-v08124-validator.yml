name: Validate SALTA v0.8.124 diagnostic contract

on:
  push:
    branches:
      - work/v0.8.124-system-log-filtering

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: work/v0.8.124-system-log-filtering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Align validator
        run: node scripts/patch-v08124-validator.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/

      - name: Run complete quality gate
        run: npm run check

      - name: Commit validated contract
        shell: bash
        run: |
          rm .github/workflows/work-v08124-validator.yml scripts/patch-v08124-validator.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(logs): align diagnostic export release contract"
          git push origin HEAD:work/v0.8.124-system-log-filtering
