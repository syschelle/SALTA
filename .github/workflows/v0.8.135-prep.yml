name: Validate v0.8.135 work branch

on:
  push:
    branches:
      - work/v0.8.135-fritz-room-presence-status

permissions:
  contents: write

jobs:
  prepare-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.8.135-fritz-room-presence-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Prepare release tree
        run: node scripts/prepare-v0.8.135.mjs
      - name: Remove temporary preparation files
        run: |
          rm scripts/prepare-v0.8.135.mjs
          rm .github/workflows/v0.8.135-prep.yml
      - name: Full SALTA quality gate
        run: npm run check
      - name: Commit validated release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve FRITZ device rooms and refresh status"
          git push origin HEAD:work/v0.8.135-fritz-room-presence-status
